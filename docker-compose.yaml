services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-debug}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-contatos}
      DB_USER: ${DB_USER:-contatos}
      DB_PASSWORD: ${DB_PASSWORD:-contatos}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-contatos}
      POSTGRES_USER: ${DB_USER:-contatos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contatos}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: